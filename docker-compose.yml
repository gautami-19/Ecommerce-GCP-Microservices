services:
  user-db:
    image: mysql:8.0
    container_name: ecommerce-user-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: user_db
      MYSQL_USER: user_app
      MYSQL_PASSWORD: user_pass
    volumes:
      - user_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uuser_app -puser_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ecommerce]

  product-db:
    image: mysql:8.0
    container_name: ecommerce-product-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: product_db
      MYSQL_USER: product_app
      MYSQL_PASSWORD: product_pass
    volumes:
      - product_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uproduct_app -pproduct_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ecommerce]

  order-db:
    image: mysql:8.0
    container_name: ecommerce-order-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_app
      MYSQL_PASSWORD: order_pass
    volumes:
      - order_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uorder_app -porder_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ecommerce]

  user-service:
    build: ./user-service
    container_name: ecommerce-user-service
    restart: unless-stopped
    environment:
      DB_HOST: user-db
      DB_PORT: "3306"
      DB_NAME: user_db
      DB_USER: user_app
      DB_PASSWORD: user_pass
      PORT: "5001"
    depends_on:
      user-db:
        condition: service_healthy
    expose: ["5001"]
    networks: [ecommerce]

  product-service:
    build: ./product-service
    container_name: ecommerce-product-service
    restart: unless-stopped
    environment:
      DB_HOST: product-db
      DB_PORT: "3306"
      DB_NAME: product_db
      DB_USER: product_app
      DB_PASSWORD: product_pass
      PORT: "5002"
    depends_on:
      product-db:
        condition: service_healthy
    expose: ["5002"]
    networks: [ecommerce]

  cart-order-service:
    build: ./cart-order-service
    container_name: ecommerce-cart-order-service
    restart: unless-stopped
    environment:
      DB_HOST: order-db
      DB_PORT: "3306"
      DB_NAME: order_db
      DB_USER: order_app
      DB_PASSWORD: order_pass
      PORT: "5003"
      PRODUCT_SERVICE_URL: http://product-service:5002
      USER_SERVICE_URL: http://user-service:5001
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      user-service:
        condition: service_started
    expose: ["5003"]
    networks: [ecommerce]

  api-gateway:
    build: ./api-gateway
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    environment:
      PORT: "5000"
      USER_SERVICE_URL: http://user-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      CART_ORDER_SERVICE_URL: http://cart-order-service:5003
      FLASK_SECRET_KEY: local-development-secret
    depends_on:
      - user-service
      - product-service
      - cart-order-service
    ports:
      - "5000:5000"
    networks: [ecommerce]

volumes:
  user_db_data:
  product_db_data:
  order_db_data:

networks:
  ecommerce:
    driver: bridge
